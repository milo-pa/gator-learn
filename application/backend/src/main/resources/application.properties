# This url is allowed to make cross-origin requests to the backend
# - Different in production env, see application-prod.properties
cors.allowed.origins=http://localhost:3003

# The connection to the mysql database
# - This url should work fine in prod env (haven't actually tested yet) since in that env the db
#   exists on localhost (running on same server)
# - However to make this work in local/dev env, we need to open a connection to the db in the aws ec2 instance and
#   port forward it to the local/dev env's localhost:3306.
# - This can be done with `ssh -i Tutoring_Server_Key.pem -L 3306:127.0.0.1:3306 ec2-user@18.144.101.99`
#   Run this command ^ to open the connection BEFORE running the backend locally
spring.datasource.url=jdbc:mysql://localhost:3306/tutoring_test
spring.datasource.username=root
spring.datasource.password=GatorLearn@Team5

# Tells hibernate what to do with the database schema (tables, cols, rows, etc)
# - 'none' means do not modify the db in any way
# - When this was set to `update`, running the backend once auto created a new table in the db,
#   so I want to avoid it unexpectedly doing anything for me since I don't know what I'm doing
spring.jpa.hibernate.ddl-auto=none
# Tells hibernate to log every SQL query it runs to console
spring.jpa.show-sql=true
# Tells hibernate what flavor of sql to use/expect: MySQL8Dialect means MySQL v8
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# This may be a duplicate of `spring.jpa.show-sql=true`: they should more or less do the same thing,
# but the more debug info the better
logging.level.org.hibernate.SQL=DEBUG
# Add additional logging for bound parameter values (e.g. `username=?` ) in sql queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

upstream myapp_upstream {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::] 80 default_server;
    server_name 18.144.101.99;

    root /var/www/tutoringapp;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Spring Boot (bound to localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Static Uploads (photos, resumes,etc)
   location ^~ /uploads/ {
       alias /var/www/tutoringapp/uploads/;
       autoindex off;
       default_type text/plain;



        #tell browser they can cache images
        #add_header Cache-Control "public, max-age = 31536000, immutable";
    }

    # Load configuration files for the default server block.
    include /etc/nginx/default.d/*.conf;

    error_page 404 /404.html;
    location = /404.html {
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
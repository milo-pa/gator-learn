name: CI/CD on Push to Main

on:
  push:
    branches: [ "feature/CI/CD" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend build (no tests)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: "21"

      - name: Build backend
        working-directory: ./application/backend
        run: |
          mvn -B clean package
          ls -l target

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: application/backend/target/SFSUTutoring-1.0.0.jar

      # Frontend build (no tests)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build frontend
        working-directory: ./application/frontend
        run: |
          npm ci
          npm run build
          ls -R build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: application/frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest

#    if: |
#      github.event_name == 'push' &&
#      github.ref == 'refs/heads/main'

    steps:
      - name: Download backend JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend-artifacts

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-artifacts

      - name: Debug artifact contents
        run: |
          echo "Backend artifacts:"
          ls -R backend-artifacts || true
          echo "Frontend artifacts:"
          ls -R frontend-artifacts || true

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Copy backend JAR to EC2
        run: |
          JAR_PATH="backend-artifacts/SFSUTutoring-1.0.0.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "Jar not found at $JAR_PATH"
            exit 1
          fi

          scp -o StrictHostKeyChecking=no "$JAR_PATH" \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_BACKEND_RELEASE_DIR }}/SFSUTutoring-1.0.0.jar

      - name: Copy frontend build to EC2
        run: |
          if [ ! -d "frontend-artifacts" ]; then
            echo "Frontend artifact directory not found"
            exit 1
          fi

          scp -o StrictHostKeyChecking=no -r frontend-artifacts/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_FRONTEND_DIR }}/

      - name: Run deploy script on EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "${{ secrets.EC2_DEPLOY_SCRIPT }}"